<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Euclid's Elements">
  <title>Euclid's Elements</title>
  <!-- Proposition I.1: two circles, each through the other's centre, and the
       equilateral triangle their intersection determines. The yellow is the
       lens (the circles' common area); the orange is the triangle. -->
  <path d="M 50.00,23.42 A 33.00,33.00 0 0 1 50.00,80.58
           A 33.00,33.00 0 0 1 50.00,23.42 Z" fill="#E6EB4F"/>
  <path d="M 33.50,52.00 L 66.50,52.00 L 50.00,23.42 Z" fill="#F49E42"/>
  <g fill="none" stroke="#1E1E1E" stroke-width="4.5" stroke-linejoin="round">
    <circle cx="33.50" cy="52.00" r="33.00"/>
    <circle cx="66.50" cy="52.00" r="33.00"/>
    <path d="M 33.50,52.00 L 66.50,52.00 L 50.00,23.42 Z"/>
  </g>
</svg>
